<div class="login-container">

  <div class="login-card">

    <h2 class="login-title">
      RBAC Login
    </h2>

    <div
      *ngIf="errorMessage"
      class="alert alert-danger"
    >
      {{ errorMessage }}
    </div>

    <div
      *ngIf="successMessage"
      class="alert alert-success"
    >
      {{ successMessage }}
    </div>

    <div class="mb-3">

      <label class="form-label">
        Username
      </label>

      <input
        type="text"
        class="form-control"
        [(ngModel)]="username"
        placeholder="Enter username"
      >

    </div>

    <div class="mb-3">

      <label class="form-label">
        Password
      </label>

      <input
        type="password"
        class="form-control"
        [(ngModel)]="password"
        placeholder="Enter password"
      >

    </div>

    <div class="mb-4">

      <label class="form-label">
        Role
      </label>

      <select
        class="form-select"
        [(ngModel)]="role"
      >

        <option>
          General User
        </option>

        <option>
          Admin
        </option>

      </select>

    </div>

    <button
      class="btn btn-primary w-100 btn-login"
      (click)="login()"
      [disabled]="loading"
    >

      <span *ngIf="!loading">
        Login
      </span>

      <span *ngIf="loading">
        Logging in...
      </span>

    </button>

  </div>

</div>
